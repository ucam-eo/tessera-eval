name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # geotessera (pulled in by the [server] extra installed below) requires
        # Python >=3.12 as of its 0.8.0 release -- has for a while, not a new
        # regression -- so 3.10/3.11 can never pass this job's `pip install`
        # step regardless of PR content. The base tessera_eval package (no
        # extras) still declares/supports >=3.10; this matrix just stops
        # claiming to verify that combination without exercising it.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [server] pulls Flask (needed by the compute-server tests); [dev] pulls test/lint tools.
          pip install -e ".[server,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
